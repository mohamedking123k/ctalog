<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#0f3d2e;--g2:#14563f;--gold:#d9a93b;--bg:#f4f5f2;--line:#e2e4de;--mut:#6b7069}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tajawal,system-ui,sans-serif;color:#1c1f1b}
a{color:inherit;text-decoration:none}
header{background:var(--g);color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.bar{max-width:1200px;margin:auto;display:flex;align-items:center;gap:14px;padding:12px 16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;white-space:nowrap}
.logo i{width:38px;height:38px;border-radius:10px;background:var(--gold);color:var(--g);display:grid;place-items:center;font-style:normal;font-size:20px}
.logo small{display:block;font-weight:500;font-size:12px;opacity:.75}
.search{flex:1;max-width:420px;margin-inline-start:auto}
.search input{width:100%;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-size:15px}
nav{background:var(--g2);overflow-x:auto;white-space:nowrap;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav .in{max-width:1200px;margin:auto;padding:0 10px}
nav a{display:inline-block;padding:10px 12px;font-size:14px;color:#dfeee6;border-bottom:3px solid transparent}
nav a.on{color:#fff;border-color:var(--gold);font-weight:700}
main{max-width:1200px;margin:auto;padding:18px 14px 60px}
h1{font-size:24px;margin:6px 0 4px}.sub{color:var(--mut);font-size:14px;margin-bottom:18px}
h2.grp{font-size:17px;color:var(--g2);margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;transition:.15s}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.tile img{width:110px;height:110px;object-fit:contain}

.chips button.on{background:var(--g);color:#fff;border-color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column}
.card .im{aspect-ratio:1;display:grid;place-items:center;background:#fff}
.card img{max-width:100%;max-height:100%;object-fit:contain}
.card .bc{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:var(--g2);margin-top:8px;letter-spacing:.5px;direction:ltr;text-align:right}
.card .bc.no{color:#b0b3ad;font-family:inherit}
.card .nm{font-size:14px;line-height:1.35;margin-top:4px;font-weight:500}
.card .br{font-size:12px;color:var(--mut);margin-top:auto;padding-top:6px}
.secnav{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:thin}.secnav a{flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13.5px;font-weight:500}.secnav a b{color:var(--g2);margin-right:4px}
h3.sec{font-size:18px;margin:22px 0 10px;padding:8px 12px;background:var(--g);color:#fff;border-radius:10px;display:flex;justify-content:space-between;scroll-margin-top:120px}h3.sec span{color:var(--gold);font-size:14px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}#lb div{background:#fff;border-radius:16px;padding:16px;max-width:460px;width:100%;text-align:center}#lb img{width:100%;max-width:420px}#lb p{margin:8px 0 0;font-size:16px;font-weight:700}#lb code{direction:ltr;display:block;color:var(--g2);margin-top:4px;font-size:15px}
.card{cursor:zoom-in;position:relative}
.st{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px}
.st.n{background:#fde8e4;color:#b3261e}.st.y{background:#e3f4e8;color:#1f7a3d}.st.m{background:#fff3d6;color:#8a5a00}.st.u{background:#eceeea;color:#666}.st.x{background:#e8e6f8;color:#4b3aa8}.st.s{background:#dff1f7;color:#0b6a8a}.st.ok::after{content:' ✓';}
.card.n{border-color:#f3c3bb}

.back{display:inline-block;margin-bottom:8px;color:var(--g2);font-weight:700;font-size:14px}
.empty{color:var(--mut);padding:40px 0;text-align:center}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px}

</style></head><body>

const cache={};const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const main=$('#main'),nav=$('#nav'),q=$('#q');
nav.innerHTML='<a href="#home" data-s="home">الكل</a>'+IDX.map(c=>`<a href="#${c.s}" data-s="${c.s}">${esc(c.a)}</a>`).join('');
async function load(s){if(!cache[s]){const r=await fetch('data/'+s+'.json');cache[s]=await r.json()}return cache[s]}
function card(p,co){return `<div class="card"><div class="im">${p.i?`<img loading="lazy" src="data:image/jpeg;base64,${p.i}" alt="">`:''}</div><div class="bc ${p.b?'':'no'}">${p.b||'بدون باركود'}</div><div class="nm">${esc(p.n)}</div><div class="br">${esc(co?co+' · '+p.r:p.r)}</div></div>`}
function home(){const groups=[...new Set(IDX.map(c=>c.g))];const tot=IDX.reduce((a,c)=>a+c.c,0);
main.innerHTML=`<h1>كتالوج الشركات</h1><div class="sub">${IDX.length} شركة · ${tot} منتج</div>`+groups.map(g=>`<h2 class="grp">${g}</h2><div class="tiles">`+IDX.filter(c=>c.g===g).map(c=>`<a class="tile" href="#${c.s}"><img src="data:image/jpeg;base64,${c.cv}" alt=""><b>${esc(c.a)}</b><span>${c.c} منتج</span></a>`).join('')+'</div>').join('')}
async function company(s){const c=IDX.find(x=>x.s===s);if(!c)return home();main.innerHTML=`<a class="back" href="#home">← كل الشركات</a><h1>${esc(c.a)}</h1><div class="empty">بحمّل المنتجات...</div>`;
const items=await load(s);let f='';
const draw=()=>{const list=items.filter(p=>(!f||p.r===f));const secs=[];list.forEach(p=>{let g=secs.find(x=>x[0]===p.s);if(!g){g=[p.s,[]];secs.push(g)}g[1].push(p)});
main.querySelector('.secnav').innerHTML=secs.map((g,i)=>`<a href="javascript:void 0" data-i="${i}">${esc(g[0])}<b>${g[1].length}</b></a>`).join('');
main.querySelector('.body').innerHTML=secs.map((g,i)=>`<h3 class="sec" id="sec${i}">${esc(g[0])}<span>${g[1].length} منتج</span></h3><div class="grid">${g[1].map(p=>card(p)).join('')}</div>`).join('');
main.querySelectorAll('.secnav a').forEach(a=>a.onclick=()=>document.getElementById('sec'+a.dataset.i).scrollIntoView({behavior:'smooth'}));bindCards(secs.flatMap(g=>g[1]))};
main.innerHTML=`<a class="back" href="#home">← كل الشركات</a><h1>${esc(c.a)}</h1><div class="sub">${c.c} منتج · اختار القسم</div>`+(c.brands.length>1?`<div class="chips"><button class="on" data-b="">كل الماركات</button>${c.brands.map(b=>`<button data-b="${esc(b)}">${esc(b)}</button>`).join('')}</div>`:'')+'<div class="secnav"></div><div class="body"></div>';
main.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{main.querySelectorAll('.chips button').forEach(x=>x.classList.remove('on'));b.classList.add('on');f=b.dataset.b;draw()});draw()}
function bindCards(list){main.querySelectorAll('.card').forEach((el,i)=>el.onclick=()=>{const p=list[i];const lb=document.getElementById('lb');lb.innerHTML=`<div>${p.i?`<img src="data:image/jpeg;base64,${p.i}">`:''}<p>${esc(p.n)}</p><code>${p.b||''}</code><small>${esc(p.r)}</small></div>`;lb.style.display='flex'})}
let st;async function search(v){const hits=IDX.filter(c=>c.names.some(n=>n.includes(v))||c.a.includes(v));main.innerHTML=`<h1>نتائج: ${esc(v)}</h1><div class="empty">بدوّر...</div>`;let out=[];for(const c of hits){const it=await load(c.s);(c.a.includes(v)?it:it.filter(p=>(p.n+' '+p.b).includes(v))).forEach(p=>out.push([p,c.a]))}
main.innerHTML=`<h1>نتائج: ${esc(v)}</h1><div class="sub">${out.length} منتج</div>`+(out.length?'<div class="grid">'+out.slice(0,300).map(([p,a])=>card(p,a)).join('')+'</div>':'<div class="empty">ما في نتائج</div>');bindCards(out.slice(0,300).map(x=>x[0]))}
q.addEventListener('input',()=>{clearTimeout(st);st=setTimeout(()=>{const v=q.value.trim();v?search(v):route()},250)});
function route(){const s=location.hash.slice(1)||'home';nav.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.s===s));const on=nav.querySelector('a.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});window.scrollTo(0,0);s==='home'?home():company(s)}
window.addEventListener('hashchange',()=>{q.value='';route()});route();
document.getElementById('lb').onclick=e=>{e.currentTarget.style.display='none'};
</script></body></html>
